<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F8F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Type-A-Saurus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Cabin:wght@400;500&family=Nunito:wght@900&family=Chewy&display=swap">
<style>
/* Everything below is laid out on a 1105 x 2048 artboard: the pixel grid of the
   reference mockup (390 x 723 pt at 2.83x). The artboard is scaled to the screen. */
:root{
  --bg:#F8F4F1;--ink:#221E1B;--sand:#EFCD97;--track:#E78170;--line:#FAEFEA;
  --hl:#7CBF7E;--pill:#D1D0D5;--kb:#F3F1ED;--gray:#ACAFB9;--ret:#197CF4;
  --kp:#A085BF;--kbl:#60A7D7;--kg:#65B670;--ko:#EC914B;--ky:#F4D257;
  --f:"Sniglet",system-ui,sans-serif;--body:"Cabin",system-ui,sans-serif;--head:"Nunito",system-ui,sans-serif;--hblue:#6F9DCA;--rgreen:#65A46A;--sandS:#F1C287;--cream:#F6F1ED;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased}
img{display:block;-webkit-user-drag:none;pointer-events:none}
.layer{position:absolute;left:0;width:1105px;transform-origin:0 0}
#top{height:1360px;top:0}
.a{position:absolute}
.t{position:absolute;white-space:nowrap;line-height:1;font-weight:400}

/* status row */
#timerTxt{left:137px;top:51px;font-size:56px;letter-spacing:.3px}
#lapTxt{right:71px;top:44px;font-size:60px;letter-spacing:-1.6px;text-align:right}
.lbn{font-size:44px;font-weight:400}

/* scene */
#sandBand{left:-700px;top:552px;width:2505px;height:96px;background:var(--sand)}
#sandEdge{left:-700px;top:646px;width:2505px;height:4px;background:var(--ink)}
#trackBand{left:-700px;top:649px;width:2505px;height:584px;background:var(--track)}
.tl{position:absolute;left:0;width:2505px;height:10px;background:var(--line)}
.runner{position:absolute;will-change:transform}
.runner img{transform-origin:50% 90%}
.runner.go img{animation:stride .26s ease-in-out infinite alternate}
.runner.trip img{animation:trip .35s linear}
.runner.dash img{animation:dash .32s cubic-bezier(.2,.8,.3,1)}
@keyframes dash{0%{transform:none}40%{transform:translateX(26px) rotate(-5deg) scaleX(1.06)}100%{transform:none}}
.runner .zoom{position:absolute;left:-70px;top:38%;width:90px;height:60px;opacity:0;transition:opacity .2s}
.runner.boost .zoom{opacity:1}
.runner .zoom i{position:absolute;right:0;height:7px;border-radius:4px;background:#fff;animation:zoom .38s linear infinite}
.runner .zoom i:nth-child(1){top:0;width:70px}.runner .zoom i:nth-child(2){top:24px;width:90px;animation-delay:.12s}.runner .zoom i:nth-child(3){top:48px;width:60px;animation-delay:.24s}
@keyframes zoom{from{transform:translateX(0);opacity:1}to{transform:translateX(-40px);opacity:0}}
@keyframes stride{from{transform:translateY(0) rotate(0)}to{transform:translateY(-7px) rotate(-1.6deg)}}
@keyframes trip{0%,100%{transform:none}25%{transform:translateX(-8px) rotate(4deg)}60%{transform:translateX(5px) rotate(-3deg)}}

/* speech bubbles */
.bub{position:absolute;border:4.5px solid var(--ink);border-radius:42px;background:var(--bg);box-shadow:0 3px 7px rgba(60,40,30,.13)}
.tail{position:absolute;overflow:visible}
.l1{position:absolute;z-index:1;font-size:49px;font-weight:400;letter-spacing:0;white-space:nowrap;line-height:1}
.l2{position:absolute;z-index:1;font-size:65px;font-weight:400;letter-spacing:.5px;white-space:nowrap;line-height:1}
.l2 .hl{position:absolute;background:var(--hl);border-radius:16px;z-index:-1;box-shadow:0 0 3px 1px rgba(124,191,126,.55)}
#p2{white-space:normal;width:748px;font-size:46px;line-height:1.32;letter-spacing:.3px;text-align:left}
#p2 .ty{background:var(--hl);border-radius:10px;padding:2px 4px;margin:0 -4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:0 0 2px 1px rgba(124,191,126,.5)}
#p2 .car{height:44px;vertical-align:-6px;margin:0 1px 0 2px}
#p2 .nx{text-underline-offset:8px;text-decoration-thickness:4px}
#p1{font-size:34px}
.l2 .car{display:inline-block;width:4px;height:50px;margin:0 2px 0 3px;vertical-align:-4px;background:var(--ink);animation:blink 1s steps(1) infinite;border-radius:2px}
.l2 .nx{text-decoration:underline;text-decoration-thickness:5px;text-underline-offset:10px;text-decoration-color:var(--hl)}
.l2 .rest{color:var(--ink)}
.l1.next{color:#8a847d;font-size:40px;letter-spacing:.2px}
.l1.next b{color:#4a4440;font-weight:400}
.ghost{position:absolute;color:#E0412B;font-weight:800;pointer-events:none;animation:ghost .55s ease-out forwards}
@keyframes ghost{0%{transform:translateY(0) scale(1.3);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
#yb.shake{animation:shake .28s linear}
@keyframes shake{20%{transform:translateX(-10px)}45%{transform:translateX(8px)}70%{transform:translateX(-5px)}100%{transform:none}}
#yb.win .bub{border-color:#3E9B4F;transition:border-color .1s}
.cheer{position:absolute;font-family:"Chewy",cursive;font-size:84px;color:#7CBF7E;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;pointer-events:none;animation:cheer .8s cubic-bezier(.2,1.4,.4,1) forwards;z-index:5}
@keyframes cheer{0%{transform:scale(.4) rotate(-8deg);opacity:0}25%{transform:scale(1.1) rotate(-4deg);opacity:1}70%{opacity:1}100%{transform:translateY(-50px) rotate(-4deg);opacity:0}}
body.mock .l2 .car{visibility:hidden}
@keyframes blink{50%{opacity:0}}

/* input: the pill sits right above the phone's own keyboard */
#pill{left:20px;top:1250px;width:1065px;height:98px;border-radius:30px;background:#FCFAF8;border:4.5px solid var(--ink);box-shadow:0 5px 0 rgba(34,30,27,.12);transition:background .15s}
#pill.bad{background:#FBD9D2}
#inTxt{left:6px;width:1105px;top:1261px;font-size:63px;text-align:center;letter-spacing:.5px;pointer-events:none}
#inTxt i{display:inline-block;width:6px;height:74px;background:#4F8ACE;vertical-align:-18px;margin-left:3px;animation:blink 1s steps(1) infinite}
#inTxt .hint{color:#7d7a80;font-size:46px;font-family:var(--body)}
#inTxt .st{font-size:52px;color:#5b5550}
#inTxt .st b{font-size:62px;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
#inTxt .st .hot{color:#E0412B}
#inp{position:absolute;left:20px;top:1250px;width:1065px;height:98px;opacity:0;border:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;outline:none;-webkit-appearance:none}

/* results: inked card, chunky outlined heading, green tag, pastel key button */
#res{position:absolute;left:60px;top:190px;width:985px;padding:50px 50px 56px;border:4.5px solid var(--ink);border-radius:42px;background:#FCFAF8;text-align:center;display:none;z-index:20;box-shadow:0 8px 0 rgba(34,30,27,.12)}
#res.show{display:block;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.chunk{display:inline-block;font-family:var(--head);font-weight:900;color:var(--hblue);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;transform:scaleX(.74);line-height:.95;letter-spacing:1px}
#res h2{font-size:170px;margin:0 -120px}
#res p{font-family:var(--body);font-size:50px;margin-top:20px;color:#3b3632}
.tag{display:inline-block;margin-top:26px;padding:10px 30px 12px;border-radius:22px;background:var(--rgreen);color:#fff;font-size:44px;line-height:1}
#res .row{display:flex;justify-content:center;gap:24px;margin-top:40px}
#res .row div{flex:1;padding:24px 0 20px;border-radius:26px;background:#E8E3E0;font-size:40px;color:#6b645e}
#res .row b{display:block;font-size:78px;color:var(--ink);font-weight:400;margin-bottom:6px}
.pkey{position:relative;display:inline-flex;align-items:center;justify-content:center;margin-top:60px;min-width:560px;height:150px;padding:0 70px;border:4.5px solid var(--ink);border-radius:34px;cursor:pointer;
  background:linear-gradient(104deg,#F9CCE7 0 52%,#C6EEF2 52% 100%);box-shadow:0 22px 0 -4px #EF9FD6,0 22px 0 0 var(--ink);transition:transform .07s,box-shadow .07s;font:inherit}
.pkey span{font-family:var(--head);font-weight:900;font-size:86px;color:#EE7896;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;transform:scaleX(.8);letter-spacing:2px}
.pkey:active,.pkey.dn{transform:translateY(16px);box-shadow:0 6px 0 -4px #EF9FD6,0 6px 0 0 var(--ink)}
#res .home{display:block;margin:44px auto 0;font-family:var(--body);font-size:42px;color:#5b5550;text-decoration:underline;text-underline-offset:8px;background:none;border:0}

/* start screen (laid out on the 981 px grid of its mockup) */
#start{position:fixed;inset:0;background:linear-gradient(var(--cream) 0 30%,var(--sandS) 30% 100%);z-index:50;overflow:hidden}
#start.off{display:none}
#sb{position:absolute;left:0;top:0;width:981px;height:2048px;transform-origin:0 0}
#sb .sky{position:absolute;left:-900px;right:-900px;top:-2000px;height:2545px;background:var(--cream)}
#sb .sand{position:absolute;left:-900px;right:-900px;top:1230px;height:3000px;background:var(--sandS)}
#sb img{position:absolute;display:block}
#enterKey{left:126px;top:1288px;width:729px;cursor:pointer;transition:transform .08s;pointer-events:auto}
#enterKey.dn{transform:translateY(14px) scale(.985);filter:brightness(.97)}
#sb .hint{position:absolute;left:0;width:981px;top:1653px;text-align:center;font-family:var(--body);font-size:50px;color:#1f1b18}
#sb .best{position:absolute;left:0;width:981px;top:1735px;text-align:center}
#sb .best span{display:inline-block;padding:8px 26px 10px;border-radius:22px;background:var(--rgreen);color:#fff;font-size:38px}
#sb .chev{position:absolute;left:440px;top:1800px}
@keyframes bob{50%{transform:translateY(-10px)}}
#sb .chev{animation:bob 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div id="start"><div id="sb">
  <div class="sky"></div><div class="sand"></div>
  <img src="img/start_title.webp" style="left:95px;top:257px;width:802px" alt="Type-A-Saurus">
  <img src="img/start_scene.webp" style="left:0;top:539px;width:981px" alt="">
  <img id="enterKey" src="img/enter_key.webp" alt="Press enter">
  <div class="hint">Tap to start or use a physical keyboard</div>
  <div class="best" id="startBest"></div>
  <svg class="chev" width="100" height="56" viewBox="0 0 100 56" fill="none" stroke="#B5A6DA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 46 50 12l40 34"/></svg>
</div></div>
<div id="top" class="layer">
  <img class="a" src="img/timer.webp" style="left:66px;top:46px;width:52px">
  <div class="t" id="timerTxt">0:00s</div>
  <div class="t" id="lapTxt">Lap 1/3</div>
  <img class="a" src="img/avatar.webp" style="left:59px;top:155px;width:98px" id="avatar">
  <img class="a" src="img/title.webp" style="left:247px;top:155px;width:612px" alt="Type-A-Saurus">
  <div id="lb"></div>

  <div id="sandBand" class="a"></div>
  <img class="a" src="img/sand.webp" style="left:47px;top:585px;width:1045px">
  <img class="a" src="img/cactus.webp" style="left:27px;top:367px;width:164px">
  <img class="a" src="img/rock.webp" style="left:200px;top:583px;width:67px">
  <img class="a" src="img/bush.webp" style="left:721px;top:546px;width:78px">
  <img class="a" src="img/mound.webp" style="left:889px;top:509px;width:162px">
  <div id="trackBand" class="a">
    <i class="tl" style="top:81px"></i><i class="tl" style="top:196px"></i><i class="tl" style="top:320px"></i><i class="tl" style="top:450px"></i>
  </div>
  <div id="sandEdge" class="a"></div>
  <img class="a" src="img/bump1.webp" style="left:879px;top:1000px;width:132px">
  <img class="a" src="img/bump2.webp" style="left:764px;top:1121px;width:132px">

  <!-- your bubble: the phrase you're typing, and what's next -->
  <div id="yb" class="a" style="left:0;top:0;width:1105px;height:600px">
    <div class="bub" id="bubR" style="left:84px;top:314px;width:818px;height:205px"></div>
    <svg class="tail" id="tail1" style="left:0;top:0" width="1105" height="600"><path id="tail1p" d="" fill="#F8F4F1" stroke="#221E1B" stroke-width="4.5" stroke-linejoin="round"/></svg>
    <div class="l1 next" id="p1" style="top:349px"></div>
    <div class="l2" id="p2" style="top:424px"></div>
  </div>
  <div id="runners"></div>
  <div id="pill" class="a"></div>
  <div class="t" id="inTxt"></div>
  <input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" aria-label="Type the phrase here">
  <div id="res"><h2 class="chunk" id="resH">1st!</h2><p id="resP"></p><div id="resB"></div>
    <div class="row"><div><b id="resW">0</b>wpm</div><div><b id="resA">100%</b>accuracy</div><div><b id="resT">0s</b>time</div></div>
    <button class="pkey" id="again"><span>RACE AGAIN</span></button>
    <button class="home" id="toStart">back to start</button></div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const MOCK=/[?&]mock/.test(location.search);

// ---------- layout: fit the artboard (scene + input pill) above the phone's keyboard ----------
function fit(){
  const vv=window.visualViewport,W=innerWidth,H=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
  const s=Math.min(W/1105,H/1360),ox=(W-1105*s)/2;
  // keyboard open: the pill sits on top of it. keyboard closed: center the scene in the spare room
  const oy=top+Math.max(0,(H-1360*s)/2);
  $('#top').style.transform=`translate(${ox}px,${oy}px) scale(${s})`;
}
addEventListener('resize',fit);if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}fit();

// ---------- race data ----------
// a fresh mix every race, shortest first so the laps ramp up
// funny sentences: letters and spaces only, so a phone keyboard never has to switch layouts
const POOL=[
 'The cactus asked for a hug and everyone panicked','My left sock is training for a marathon without me','A pigeon stole my fries and showed zero remorse',
 'The dinosaur forgot his password and blamed the meteor','I tripped over nothing and then apologized to it','Grandma beat me at arm wrestling for the third time',
 'The toaster has opinions and frankly they are rude','My houseplant is thriving out of pure spite','This sandwich has seen things you would not believe',
 'A goose chased me for a mile and I deserved it','The boulder says it is just rolling with the punches','I told my dog a secret and now the whole park knows',
 'My noodles are wiggling suspiciously in the pot','The moon called and it wants its cheese back','My blob friend sneezed and launched himself into orbit',
 'A speed bump is just a nap with a yellow stripe','Never trust a cactus that offers you a high five','The soup is too hot so I challenged it to a duel',
 'My shoes are louder than my thoughts this morning','The vacuum and the cat have entered peace talks','I put my phone in the fridge and my milk in my pocket',
 'A squirrel is staring at me like I owe it money','The hamster is running for mayor on a wheel platform','My alarm clock and I are no longer on speaking terms',
 'The pancake flipped itself and demanded applause','This desert is dry but my jokes are drier','The blue blob ran so fast his nose arrived late',
 'I sneezed so hard the cactus said bless you','My calculator says I am bad at math and it is right','The spaghetti tangled itself out of pure drama',
 'A tumbleweed rolled by and judged my outfit','My rubber duck has seen me at my worst','The lizard on that rock is clearly the main character',
 'Running is easy if you pretend the snacks are ahead','The potato in my pantry has started growing ambitions'];
let PHRASES;
function deal(){const p=POOL.slice().sort(()=>Math.random()-.5).slice(0,3).sort((a,b)=>a.length-b.length);PHRASES=[[p[0]],[p[1]],[p[2]]]}  // one sentence per lap
// runners: sprite, mockup position, and how far into the lap that position is
const R=[
  {id:'blue',you:1,x:229,y:529,w:278,lb:'lb_blue',lbw:70,mp:.42},
  {id:'purple',x:46,y:795,w:226,lb:'avatar',lbw:62,mp:.12,cps:3.5},
  {id:'orange',x:265,y:969,w:191,lb:'lb_orange',lbw:74,mp:.30,cps:3.9},
  {id:'green',x:566,y:829,w:342,lb:'lb_green',lbw:70,mp:.55,cps:3.3},
];
const S=470;   // how far a runner travels across one lap
R.forEach(r=>{r.span=S;const el=document.createElement('div');el.className='runner';el.style.left='0px';el.style.top=r.y+'px';el.innerHTML=(r.you?'<div class="zoom"><i></i><i></i><i></i></div>':'')+`<img src="img/${r.id}.webp" style="width:${r.w}px">`;$('#runners').appendChild(el);r.el=el});

let G;
function reset(){
  deal();
  G={lap:0,pi:0,typed:'',chars:0,t0:0,t:0,run:false,done:false,keys:0,typos:0,streak:0,miss:false};
  R.forEach(r=>{r.lap=0;r.p=0;r.el.classList.remove('go','boost')});
  $('#res').classList.remove('show');
  if(MOCK){PHRASES[1][0]='The toaster has opinions and frankly they are rude';G.lap=1;G.typed='The toaster has op';G.t=45;R.forEach(r=>{r.lap=1;r.p=r.mp})}
  R.forEach(r=>r.d=r.lap+r.p);
  render();
}
const lapLen=l=>PHRASES[l].join('').length;
const phrase=()=>G.lap>=3?'FINISH LINE':PHRASES[G.lap][G.pi];
const nextPhrase=()=>{let l=G.lap,i=G.pi+1;if(l<3&&i>=PHRASES[l].length){l++;i=0}return l>=3?null:PHRASES[l][i]};
const wpmNow=()=>G.t>1?Math.round(G.chars/5/(G.t/60)):0;

// ---------- rendering ----------
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// the sentence: typed part on a green highlight that wraps with the lines, a caret, the next letter underlined
function line2(el,typed,rest){
  const n=rest.slice(0,1);
  el.innerHTML=(typed?`<span class="ty">${esc(typed)}</span>`:'')+`<span class="car"></span><span class="nx">${n===' '?'&nbsp;':esc(n)}</span><span class="rest">${esc(rest.slice(1))}</span>`;
}
function centerX(el,cx){el.style.left=(cx-el.offsetWidth/2)+'px'}
let lastPh='';
function render(){
  const ph=phrase(),nx=nextPhrase();
  const p1=$('#p1');p1.innerHTML=G.done?'':!G.run&&!G.chars?'type the sentence to start running':`sentence <b>${Math.min(3,G.lap+1)}</b> of 3${nx?'':' &nbsp;·&nbsp; last one!'}`;centerX(p1,493);
  const p2=$('#p2');
  if(ph!==lastPh){p2.style.fontSize='46px';lastPh=ph}
  line2(p2,G.typed,ph.slice(G.typed.length));
  // at most three lines; shrink a touch for the long ones
  if(p2.offsetHeight>3*46*1.32+6){p2.style.fontSize='40px';line2(p2,G.typed,ph.slice(G.typed.length))}
  // the bubble grows upward from its tail to fit the label and the sentence
  const h=p2.offsetHeight,bh=24+40+14+h+30,bt=519-bh;
  const bub=$('#bubR');bub.style.top=bt+'px';bub.style.height=bh+'px';
  p1.style.top=(bt+24)+'px';p2.style.top=(bt+24+40+14)+'px';p2.style.left='124px';
  const focused=document.activeElement&&document.activeElement.id==='inp';
  $('#inTxt').innerHTML=!MOCK&&!G.chars&&!focused?'<span class="hint">Tap here to start typing</span>':
    `<span class="st"><b>${wpmNow()}</b> wpm &nbsp;&nbsp;·&nbsp;&nbsp; <b class="${G.streak>=15?'hot':''}">${G.streak}</b> streak</span>`;
  $('#timerTxt').textContent=`${Math.floor(G.t/60)}:${String(Math.floor(G.t%60)).padStart(2,'0')}s`;
  $('#lapTxt').textContent=`Lap ${Math.min(3,G.lap+1)}/3`;
  place();board();
}
function r0x(){const b=R[0],f=b.d>=3?1:b.d-Math.floor(b.d);return b.x+(f-b.mp)*b.span}
function place(){
  // runners glide toward their real progress (r.d is the displayed lap+progress)
  R.forEach(r=>{const f=r.d>=3?1:r.d-Math.floor(r.d);r.el.style.transform=`translateX(${r.x+(f-r.mp)*r.span}px)`});
  const b=R[0],f=b.d>=3?1:b.d-Math.floor(b.d),bx=(f-b.mp)*b.span,hx=Math.max(270,Math.min(860,488+bx));
  $('#tail1p').setAttribute('d',`M${hx} 515 Q${hx-2} 545 ${hx-20} 563 Q${hx+12} 552 ${hx+36} 515`);
}
function standings(){return R.slice().sort((a,b)=>(b.lap+b.p)-(a.lap+a.p))}
function board(){
  let s=standings().slice(0,3);
  const ys=[[140,159],[232,247],[322,337]];
  let h='';
  if(MOCK&&!G.run){const m=[['lb_blue',995,140,70],['lb_orange',987,232,74],['lb_yellow',985,322,76]];m.forEach(([n,x,y,w],i)=>h+=`<div class="t lbn" style="left:${[944,940,940][i]}px;top:${ys[i][1]-6}px">${i+1}</div><img class="a" src="img/${n}.webp" style="left:${x}px;top:${y}px;width:${w}px">`)}
  else s.forEach((r,i)=>h+=`<div class="t lbn" style="left:${[944,940,940][i]}px;top:${ys[i][1]-6}px">${i+1}</div><img class="a" src="img/${r.lb}.webp" style="left:${1030-r.lbw/2}px;top:${ys[i][0]}px;width:${r.lbw}px">`);
  $('#lb').innerHTML=h;
}

// ---------- input ----------
function press(k){
  if(G.done)return;
  // wrong letters are never entered, so a backspace right after one just clears the mistake
  if(k==='del'){if(G.miss)G.miss=false;else if(G.typed&&!G.typed.endsWith(' ')){G.typed=G.typed.slice(0,-1);G.chars--}render();return}
  if(k.length!==1)return;
  if(!G.run){G.run=true;G.t0=performance.now()-G.t*1000;R.forEach(r=>r.el.classList.add('go'));requestAnimationFrame(loop)}
  G.keys++;
  const ph=phrase(),want=ph[G.typed.length];
  if(want!==undefined&&k===want.toLowerCase()){
    G.typed+=want;G.chars++;G.miss=false;G.streak++;tick();
    R[0].el.classList.toggle('boost',G.streak>=15);
    if(G.typed===ph){G.pi++;G.typed='';phraseDone();if(G.pi>=PHRASES[G.lap].length){G.pi=0;G.lap++;if(G.lap>=3)return finish()}}
  }else{G.typos++;G.miss=true;G.streak=0;R[0].el.classList.remove('boost');buzz();ghost(k);
    const pl=$('#pill');pl.classList.add('bad');setTimeout(()=>pl.classList.remove('bad'),180);
    const yb=$('#yb');yb.classList.remove('shake');void yb.offsetWidth;yb.classList.add('shake');
    const e=R[0].el;e.classList.remove('trip');void e.offsetWidth;e.classList.add('trip')}
  const you=R[0];you.lap=Math.min(G.lap,2);you.p=G.lap>=3?1:(PHRASES[G.lap].slice(0,G.pi).join('').length+G.typed.length)/lapLen(G.lap);
  render();
}
// a wrong letter pops up in red right where it was typed, then floats away
function ghost(k){const p2=$('#p2'),c=p2.querySelector('.car');if(!c)return;const g=document.createElement('span');g.className='ghost';g.textContent=k===' '?'␣':k;
  g.style.cssText=`left:${p2.offsetLeft+c.offsetLeft+4}px;top:${p2.offsetTop+c.offsetTop-14}px;font-size:${p2.style.fontSize||'46px'}`;$('#top').appendChild(g);setTimeout(()=>g.remove(),600)}
const CHEERS=['Nice!','Zoom!','Yes!','Speedy!','Boom!','Clean!'];
function phraseDone(){
  const yb=$('#yb');yb.classList.add('win');setTimeout(()=>yb.classList.remove('win'),220);
  const e=R[0].el;e.classList.remove('dash');void e.offsetWidth;e.classList.add('dash');
  const c=document.createElement('div');c.className='cheer';c.textContent=G.streak>=15?'On fire!':CHEERS[(Math.random()*CHEERS.length)|0];
  // pop it beside your runner's head
  const b=R[0],f=b.d-Math.floor(b.d),hx=Math.max(120,Math.min(760,r0x()+300));c.style.left=hx+'px';c.style.top='520px';$('#top').appendChild(c);setTimeout(()=>c.remove(),850);
  [784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.09,.03),i*55));
}
const inp=$('#inp'),SENT='_';inp.value=SENT;
inp.addEventListener('input',e=>{
  const v=inp.value;
  if(v.length<SENT.length)press('del');else for(const ch of v.slice(SENT.length))press(ch.toLowerCase());
  inp.value=SENT;inp.setSelectionRange(1,1);
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
inp.addEventListener('focus',()=>{window.scrollTo(0,0);render()});inp.addEventListener('blur',()=>render());
// tap anywhere to bring the keyboard back
addEventListener('pointerdown',e=>{if(e.target.closest('#res')||e.target.closest('#start'))return;if(document.activeElement!==inp){e.preventDefault();inp.focus({preventScroll:true})}});

let AC;function tone(f,d=.05,v=.025,type='triangle'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const tick=()=>tone(640+Math.min(G.streak,30)*9+Math.random()*40,.045,.022);const buzz=()=>{tone(160,.1,.04,'square');try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}};

// ---------- the race loop: bots run, the clock ticks ----------
let last=0;
function loop(now){
  if(!G.run||G.done)return;
  const dt=last?Math.min(.05,(now-last)/1000):0;last=now;G.t=(now-G.t0)/1000;
  R.slice(1).forEach(r=>{if(r.lap>=3)return;r.p+=r.cps*(0.85+Math.random()*.3)*dt/lapLen(Math.min(r.lap,2));if(r.p>=1){r.p-=1;r.lap++;if(r.lap>=3){r.p=1;r.el.classList.remove('go')}}});
  R.forEach(r=>{const tgt=r.lap+r.p;r.d+=(tgt-r.d)*Math.min(1,dt*(r.you?14:8));if(Math.abs(tgt-r.d)<.0005)r.d=tgt});
  liveTick();requestAnimationFrame(loop);
}
// per frame: move runners and the clock without rebuilding the phrase
let lastStat=0;
function liveTick(){place();$('#timerTxt').textContent=`${Math.floor(G.t/60)}:${String(Math.floor(G.t%60)).padStart(2,'0')}s`;
  const now=performance.now();if(now-lastStat>250){lastStat=now;render()}}
function finish(){
  G.done=true;G.run=false;last=0;const you=R[0];you.lap=3;you.p=1;you.el.classList.remove('go');
  const place=1+R.slice(1).filter(r=>r.lap>=3).length;
  const wpm=Math.round(G.chars/5/(G.t/60)),acc=G.keys?Math.round(100*(G.keys-G.typos)/G.keys):100;
  $('#resH').textContent=place+['th','st','nd','rd'][place]||place+'th';$('#resH').textContent=place+(['th','st','nd','rd'][place]||'th')+'!';
  $('#resP').textContent=place===1?'Fastest dino on the track.':'So close. One more go?';
  let best=0;try{best=+localStorage.getItem('tas.best')||0}catch(e){}
  $('#resB').innerHTML=wpm>best?`<span class="tag">${best?'NEW BEST! UP FROM '+best:'FIRST BEST SET'}</span>`:`<span class="tag" style="background:#9a948e">BEST ${best} WPM</span>`;
  if(wpm>best)try{localStorage.setItem('tas.best',wpm)}catch(e){}
  $('#resW').textContent=wpm;$('#resA').textContent=acc+'%';$('#resT').textContent=G.t.toFixed(1)+'s';
  R.forEach(r=>r.d=r.lap+r.p);render();$('#res').classList.add('show');[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,.03),i*80));
}
$('#again').onclick=()=>{reset();inp.focus({preventScroll:true})};
// ---------- start screen ----------
const startEl=$('#start'),key=$('#enterKey');
function fitStart(){const W=innerWidth,H=innerHeight,s=Math.min(W/981,H/2048),ox=(W-981*s)/2,oy=Math.max(0,(H-2048*s)/2);$('#sb').style.transform=`translate(${ox}px,${oy}px) scale(${s})`}
addEventListener('resize',fitStart);fitStart();
function showStart(){let best=0;try{best=+localStorage.getItem('tas.best')||0}catch(e){}
  $('#startBest').innerHTML=best?`<span>BEST ${best} WPM</span>`:'';startEl.classList.remove('off');inp.blur()}
function go(){if(startEl.classList.contains('off'))return;key.classList.add('dn');tone(660,.08,.03);
  // focus inside the tap so iOS opens the keyboard
  inp.focus({preventScroll:true});setTimeout(()=>{key.classList.remove('dn');startEl.classList.add('off');reset();inp.focus({preventScroll:true})},110)}
startEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();go()});
addEventListener('keydown',e=>{if(!startEl.classList.contains('off')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go()}
  else if($('#res').classList.contains('show')&&e.key==='Enter'){e.preventDefault();$('#again').click()}});
$('#toStart').onclick=()=>{$('#res').classList.remove('show');showStart()};

if(MOCK)document.body.classList.add('mock');
document.fonts.ready.then(()=>{reset()});
if(MOCK)startEl.classList.add('off');else showStart();
reset();
window.__G=()=>G;
})();
</script>
</body>
</html>
