<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Campfire</title>
<meta name="description" content="Sit at a fire with strangers. No words. You are not here alone.">
<meta name="theme-color" content="#0e0b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campfire">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f3eadd;--mut:#b7a893;--dim:#7d6f5e;--amber:#ffb24a;--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#0e0b16}
body{color:var(--ink);font-family:var(--sans);font-weight:600;overscroll-behavior:none;touch-action:none}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
.top{position:fixed;top:0;left:0;right:0;z-index:2;padding:calc(env(safe-area-inset-top) + 16px) 20px 0;text-align:center;pointer-events:none}
.mood{font-family:var(--serif);font-weight:400;font-style:italic;font-size:18px;color:var(--mut);transition:opacity .6s}
.here{font-size:12px;font-weight:600;color:var(--dim);margin-top:4px;letter-spacing:.03em}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:2;padding:0 20px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:center;gap:12px}
.hint{font-size:12px;color:var(--dim);transition:opacity .5s;text-align:center}
.feed{display:flex;align-items:center;gap:9px;padding:13px 22px;border-radius:999px;font-family:var(--sans);font-weight:700;font-size:15px;color:#2a1600;
  background:linear-gradient(90deg,#ff9b3d,#ffd06a);box-shadow:0 10px 30px rgba(255,155,61,.22)}
.feed:active{transform:translateY(1px)}
.wordmark{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:20px;z-index:2;font-family:var(--serif);font-weight:500;font-size:17px;color:var(--mut);pointer-events:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%) translateY(-20px);z-index:3;opacity:0;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);transition:opacity .5s,transform .5s;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="wordmark">Campfire</div>
<div class="top"><div class="mood" id="mood">the fire is low</div><div class="here" id="here"></div></div>
<div id="toast"></div>
<div class="bottom">
  <div class="hint" id="hint">tap the ground to walk · tap someone to say hi</div>
  <button class="feed" id="feed">🪵 feed the fire</button>
</div>

<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ---------- fire geometry ----------
let FX,FY; // fire base position
function layout(){ FX=W/2; FY=H*0.60; seatAll(); }

// ---------- presence (mock backend) ----------
// Characters: AI are named, recurring, labelled. Humans are anonymous "someone".
const AI_CHARS=[
  {name:'ember',  col:'#db5a1f', feed:0.5, warm:0.25, calm:0.5},  // tends the fire often
  {name:'juniper',col:'#57b23a', feed:0.1, warm:0.6,  calm:0.4},  // sends warmth a lot
  {name:'pax',    col:'#8a63d6', feed:0.05,warm:0.1,  calm:0.9},  // quiet, barely moves
  {name:'wren',   col:'#ee5ba3', feed:0.2, warm:0.35, calm:0.6},
  {name:'sol',    col:'#f2b63a', feed:0.35,warm:0.3,  calm:0.5},
];
const PALETTE=['#db5a1f','#57b23a','#ee5ba3','#2f6fe0','#3fae8e','#f2b63a','#8a63d6'];
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f); return 'rgb('+r+','+g+','+b+')'; }
let seats=[], you=null, embers=[], motes=[], logs=[], fire={size:0,flare:0};

// walkable clearing around the fire; depth (scale) comes from y
function scaleY(y){ const top=H*0.50, bot=H*0.80; return 0.72+Math.max(0,Math.min(1,(y-top)/(bot-top)))*0.46; }
function randPos(){ const l=W*0.12,r=W*0.88,top=H*0.50,bot=H*0.80; let x,y,n=0; do{x=rand(l,r);y=rand(top,bot);n++;}while(Math.hypot(x-FX,y-FY)<74&&n<25); return {x,y}; }
function clampPos(a){ a.x=Math.max(W*0.1,Math.min(W*0.9,a.x)); a.y=Math.max(H*0.49,Math.min(H*0.81,a.y)); }
function makeAvatar(opts){
  const a=Object.assign({x:0,y:0,s:1,phase:rand(0,6.28),warmGlow:0,lean:0,act:0,actT:0,ai:false,hue:30,name:'',
    breathPh:rand(0,6.28),breathSpd:rand(.85,1.05),look:0,lookObj:null,lookUntil:0,reach:0,slump:rand(.05,.3),perk:0,
    tx:0,ty:0,moving:false,face:1,walkPh:0,speed:rand(66,82),interactWith:null,_intent:null,_greetObj:null},opts);
  // personality in the rig: calm characters slump more and breathe slower
  if(opts.brain){ a.slump=0.1+opts.brain.calm*0.45; a.breathSpd=0.65+(1-opts.brain.calm)*0.55; a.color=opts.brain.col; }
  if(opts.you){ a.slump=0.1; a.color=a.color||'#2f6fe0'; }
  if(!a.color) a.color=pick(PALETTE);
  a.colorDark=shade(a.color,0.78);
  a.sq=Math.floor(rand(0,3)); // which squiggle style sits on top
  return a;
}
function seatAll(){ seats.forEach(a=>{ clampPos(a); a.s=scaleY(a.y); }); }
function placeAt(a,x,y){ a.x=x;a.y=y;a.tx=x;a.ty=y;a.s=scaleY(y); }
function startScene(){
  seats=[];
  you=makeAvatar({you:true,name:'you',col:'#2f6fe0'});
  placeAt(you,FX,H*0.75); seats.push(you);
  // seed with 3 AI characters, scattered around the clearing
  const chosen=[...AI_CHARS].sort(()=>Math.random()-0.5).slice(0,3);
  chosen.forEach(c=>{const a=makeAvatar({ai:true,name:c.name,brain:c}); const q=randPos(); placeAt(a,q.x,q.y); seats.push(a);});
  updateMood();
  setInterval(maybeArrive,10000);
  setInterval(aiTick,1700);
}
function maybeArrive(){
  if(seats.length<6 && Math.random()<0.5){
    let nc=null;
    if(Math.random()<0.45){ nc=makeAvatar({ai:false,name:''}); toast('someone wandered in'); }
    else { const used=seats.filter(s=>s.ai).map(s=>s.name); const avail=AI_CHARS.filter(c=>!used.includes(c.name)); if(avail.length){const c=pick(avail);nc=makeAvatar({ai:true,name:c.name,brain:c});} }
    if(nc){ const q=randPos(); placeAt(nc,q.x,q.y); seats.push(nc); updateMood(); flare(0.4);
      const nw=performance.now(); seats.forEach(s=>{ if(s!==nc){ s.lookObj=nc; s.lookUntil=nw+1700; s.perk=Math.max(s.perk,0.5);} }); }
  } else if(seats.length>4 && Math.random()<0.22){
    const i=seats.findIndex(s=>s!==you&&!s.moving); if(i>0){seats.splice(i,1);updateMood();}
  }
}
// AI wander / tend / greet
function aiTick(){
  for(const a of seats){ if(!a.ai||!a.brain||a.moving||a.act)continue; const b=a.brain;
    if(Math.random()<b.calm*0.55)continue;        // calm ones mostly stay put
    if(Math.random()>0.55)continue;
    const r=Math.random();
    if(r<b.feed){ a._intent='tend'; a.tx=FX+rand(-64,64); a.ty=FY+rand(28,40); a.moving=true; }
    else if(r<b.feed+b.warm){ const t=pick(seats.filter(s=>s!==a)); if(t){ a._intent='greet'; a._greetObj=t; a.tx=t.x+(t.x>a.x?-34:34); a.ty=t.y; a.moving=true; } }
    else { const p=randPos(); a.tx=p.x; a.ty=p.y; a._intent=null; a.moving=true; }
  }
}
function updateMood(){
  const n=seats.length;
  const m = n<=2?'the fire is low tonight':n<=4?'the fire is warm':n<=5?'the fire is bright':'the fire is roaring';
  document.getElementById('mood').textContent=m;
  const others=n-1;
  document.getElementById('here').textContent = others===0?'you are keeping it alive':others+(others===1?' other is here':' others are here');
}

// ---------- actions ----------
function flare(amt){ fire.flare=Math.min(2.4,fire.flare+amt); }
function feedFire(av){ av.act='toss'; av.actT=0; }
function sendWarmth(from,to){ if(from===to)return; motes.push({x:from.x,y:from.y-30*from.s,tx:to.x,ty:to.y-30*to.s,t:0,hue:warmHue(from)}); from.lean=1; from.lookObj=to; from.lookUntil=performance.now()+1600; to._pendingFrom=from; }
function receiveWarmth(av){ av.warmGlow=1; av.lean=1; av.perk=1; if(av._pendingFrom){ av.lookObj=av._pendingFrom; av.lookUntil=performance.now()+2600; av._pendingFrom=null; } }
function warmHue(a){ return 38; }
function moveAvatar(a,dt){
  const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
  if(d>3){ const m=Math.min(d, a.speed*dt); a.x+=dx/d*m; a.y+=dy/d*m; a.moving=true; a.walkPh+=dt*11; if(Math.abs(dx)>1.5) a.face=dx<0?-1:1; }
  else if(a.moving){ a.x=a.tx; a.y=a.ty; a.moving=false; onArrive(a); }
  const fd=Math.hypot(a.x-FX,a.y-FY); if(fd<56){ const an=Math.atan2(a.y-FY,a.x-FX)||1.57; a.x=FX+Math.cos(an)*56; a.y=FY+Math.sin(an)*56; }
  clampPos(a); a.s=scaleY(a.y);
}
function onArrive(a){
  if(a===you && you.interactWith){ const t=you.interactWith; you.interactWith=null; if(near(you,t,64)) greet(you,t); }
  else if(a.ai && a._intent==='tend'){ feedFire(a); a._intent=null; }
  else if(a.ai && a._intent==='greet' && a._greetObj){ greet(a,a._greetObj); a._intent=null; a._greetObj=null; }
}
function near(a,b,r){ return Math.hypot(a.x-b.x,a.y-b.y)<r; }
function greet(from,to){ const nw=performance.now();
  from.lookObj=to; from.lookUntil=nw+2200; to.lookObj=from; to.lookUntil=nw+2200;
  from.perk=1; to.perk=1; sendWarmth(from,to); setTimeout(()=>receiveWarmth(to),500);
  if(from===you && to.ai) toast('you said hi to '+to.name);
  else if(from===you) toast('you said hi');
}

// your gestures
document.getElementById('feed').addEventListener('click',()=>{ feedFire(you); hideHint(); });
cv.addEventListener('pointerdown',e=>{
  const mx=e.clientX,my=e.clientY; hideHint();
  // tap an avatar? walk over and say hi
  let best=null,bd=52;
  for(const a of seats){ if(a===you)continue; const d=Math.hypot(a.x-mx,(a.y-26*a.s)-my); if(d<bd){bd=d;best=a;} }
  if(best){ you.interactWith=best; you.tx=best.x+(best.x>you.x?-34:34); you.ty=best.y; return; }
  // else walk to the tapped spot (kept out of the fire and inside the clearing)
  you.interactWith=null;
  let tx=Math.max(W*0.1,Math.min(W*0.9,mx)), ty=Math.max(H*0.5,Math.min(H*0.8,my));
  if(Math.hypot(tx-FX,ty-FY)<62){ const an=Math.atan2(ty-FY,tx-FX)||1.57; tx=FX+Math.cos(an)*64; ty=FY+Math.sin(an)*64; }
  you.tx=tx; you.ty=ty;
});

// ---------- toast ----------
let toastT; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
let hintGone=false; function hideHint(){ if(hintGone)return;hintGone=true;document.getElementById('hint').style.opacity='0'; }

// ---------- render ----------
let t=0,last=performance.now();
function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt;
  // fire dynamics
  fire.size += (( (seats.length) *0.55+2.6) - fire.size)*dt*2;
  fire.flare += (0 - fire.flare)*dt*1.1;
  // avatars update (movement + the rig: breathing, gaze, lean, perk, reach)
  for(const a of seats){
    moveAvatar(a,dt);
    a.warmGlow=Math.max(0,a.warmGlow-dt*0.6);
    a.lean=Math.max(0,a.lean-dt*1.2);
    a.perk=Math.max(0,a.perk-dt*1.1);
    // gaze: toward whoever you're looking at, else your walking direction, else the fire
    const tx=(a.lookUntil>now&&a.lookObj)?a.lookObj.x:(a.moving?a.x+a.face*140:FX);
    const want=Math.max(-1,Math.min(1,(tx-a.x)/90));
    a.look+=(want-a.look)*Math.min(1,dt*4);
    // reach-to-feed
    if(a.act==='toss'){ a.actT+=dt; a.reach=Math.sin(Math.min(1,a.actT/0.5)*Math.PI); if(a.actT>0.2&&!a._tossed){ a._tossed=true; logs.push({x:a.x+ (FX>a.x?1:-1)*20*a.s,y:a.y-26*a.s,tx:FX+rand(-6,6),ty:FY-4,t:0}); } if(a.actT>0.5){a.act=0;a.actT=0;a._tossed=false;} }
    else a.reach=Math.max(0,a.reach-dt*3);
  }
  // logs flying into fire
  logs=logs.filter(l=>{ l.t+=dt*2.2; if(l.t>=1){ flare(0.6); return false;} return true; });
  // motes (warmth)
  motes=motes.filter(m=>{ m.t+=dt*1.3; if(m.t>=1){ return false; } return true; });
  // embers
  if(Math.random()<0.6){ embers.push({x:FX+rand(-10,10),y:FY-8,vx:rand(-10,10),vy:rand(-50,-90),life:rand(1,2),born:now,sz:rand(1,2.4)}); }
  embers=embers.filter(e=>{ const age=(now-e.born)/1000; e.x+=e.vx*dt+Math.sin(age*6)*4*dt; e.y+=e.vy*dt; e.vy+=6*dt; return age<e.life; });
  render(now);
  requestAnimationFrame(frame);
}

function render(now){
  // night sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0c0a16');sky.addColorStop(.55,'#141020');sky.addColorStop(1,'#241826');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,245,220,.5)';
  for(let i=0;i<40;i++){ const sx=(i*73.3)%W, sy=((i*131.7)%(H*0.45)); const tw=0.5+0.5*Math.sin(now/700+i); ctx.globalAlpha=0.15+tw*0.4; ctx.fillRect(sx,sy,1.4,1.4);} ctx.globalAlpha=1;
  // ground glow (fire light pool)
  const fl=fire.size+fire.flare;
  const pool=ctx.createRadialGradient(FX,FY+6,8,FX,FY+6,175+fl*42);
  pool.addColorStop(0,'rgba(255,165,70,.66)');pool.addColorStop(.5,'rgba(225,95,45,.24)');pool.addColorStop(1,'transparent');
  ctx.fillStyle=pool;ctx.beginPath();ctx.ellipse(FX,FY+10,175+fl*42,62+fl*14,0,0,7);ctx.fill();
  // ground
  ctx.fillStyle='#1a1320';ctx.beginPath();ctx.ellipse(FX,FY+18,W*0.6,H*0.18,0,0,7);ctx.fill();

  // sort avatars back-to-front by y
  const order=[...seats].sort((a,b)=>a.y-b.y);
  // draw back avatars (those above fire line) first, then fire, then front avatars — simpler: draw all behind, fire, all in front
  const behind=order.filter(a=>a.y<=FY), front=order.filter(a=>a.y>FY);
  for(const a of behind) drawAvatar(a,now);
  drawFire(now,fl);
  for(const a of front) drawAvatar(a,now);

  // warmth motes (drawn above)
  for(const m of motes){ const e=easeInOut(m.t); const x=m.x+(m.tx-m.x)*e, y=m.y+(m.ty-m.y)*e - Math.sin(m.t*Math.PI)*40;
    const g=ctx.createRadialGradient(x,y,0,x,y,10); g.addColorStop(0,'hsla('+m.hue+',90%,80%,.95)');g.addColorStop(1,'transparent'); ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill(); }
  // embers
  for(const e of embers){ const age=(now-e.born)/1000; ctx.globalAlpha=Math.max(0,1-age/e.life); ctx.fillStyle='#ffb14a'; ctx.beginPath();ctx.arc(e.x,e.y,e.sz,0,7);ctx.fill(); } ctx.globalAlpha=1;
  // logs flying
  for(const l of logs){ const x=l.x+(l.tx-l.x)*l.t, y=l.y+(l.ty-l.y)*l.t - Math.sin(l.t*Math.PI)*40; ctx.save();ctx.translate(x,y);ctx.rotate(l.t*6);ctx.fillStyle='#6b4a2c';ctx.fillRect(-7,-2.5,14,5);ctx.restore(); }
}

function drawFire(now,fl){
  const baseH=36+fl*24, baseW=24+fl*10;
  // outer glow
  const gl=ctx.createRadialGradient(FX,FY-baseH*0.4,4,FX,FY-baseH*0.4,baseH*1.6);
  gl.addColorStop(0,'rgba(255,185,90,.78)');gl.addColorStop(.55,'rgba(255,120,45,.28)');gl.addColorStop(1,'transparent');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(FX,FY-baseH*0.4,baseH*1.7,0,7);ctx.fill();
  // logs at base
  ctx.strokeStyle='#4a3420';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(FX-18,FY+4);ctx.lineTo(FX+16,FY-2);ctx.moveTo(FX-14,FY-2);ctx.lineTo(FX+18,FY+4);ctx.stroke();
  // flames: layered flickering
  const layers=[{c:'#8a2d12',w:1.15,h:1.0},{c:'#e6531b',w:0.9,h:0.92},{c:'#ff8a2a',w:0.66,h:0.8},{c:'#ffd24a',w:0.4,h:0.6}];
  for(const L of layers){ flame(FX,FY,baseW*L.w,baseH*L.h,L.c,now); }
  // bright core (hotter, whiter)
  const core=ctx.createRadialGradient(FX,FY-baseH*0.3,1,FX,FY-baseH*0.3,baseH*0.4);
  core.addColorStop(0,'rgba(255,252,230,1)');core.addColorStop(.6,'rgba(255,230,150,.85)');core.addColorStop(1,'transparent');
  ctx.fillStyle=core;ctx.beginPath();ctx.ellipse(FX,FY-baseH*0.3,baseW*0.3,baseH*0.34,0,0,7);ctx.fill();
}
function flame(x,y,w,h,col,now){
  // a flickering teardrop flame
  const sway=Math.sin(now/180+x)*w*0.22;
  const tipY=y-h*1.1+Math.sin(now/150)*3;
  const bulge=w*(0.42+0.06*Math.sin(now/130));
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x+sway, tipY);
  ctx.quadraticCurveTo(x+w*0.72, y-h*0.42, x+bulge, y);
  ctx.quadraticCurveTo(x, y+4, x-bulge, y);
  ctx.quadraticCurveTo(x-w*0.72, y-h*0.42, x+sway, tipY);
  ctx.fill();
}

function drawAvatar(a,now){
  const s=a.s;
  const breath=Math.sin(now/700*a.breathSpd + a.breathPh);
  const wk=a.moving?Math.sin(a.walkPh):0;
  const bob=breath*1.6*s + (a.moving?Math.sin(a.walkPh*2)*1.3*s:0);
  const sway=a.moving?0:Math.sin(t*1.1+a.phase)*1.0*s;
  const lean=a.lean*(FX>a.x?3:-3);
  const bx=a.x+sway+lean, by=a.y;
  const dir=FX>bx?1:-1;
  const look=a.look, perk=a.perk;
  const slump=a.slump*(1-perk);
  const col=a.color, dark=a.colorDark;
  const OUT='#1b1a16', lw=3.2*Math.max(.82,s);
  const bw=36*s, bh=46*s, cx=bx;
  const sq=1+breath*0.045+perk*0.06;        // breathing squash
  // shadow
  ctx.fillStyle='rgba(0,0,0,.26)';ctx.beginPath();ctx.ellipse(a.x,by+11*s,bw*0.5,4*s,0,0,7);ctx.fill();
  // soft warm glow when warmed
  if(a.warmGlow>0.02){ const g=ctx.createRadialGradient(bx,by-bh*0.5,2,bx,by-bh*0.5,bw*1.3); g.addColorStop(0,'rgba(255,190,100,'+(0.45*a.warmGlow)+')');g.addColorStop(1,'transparent'); ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by-bh*0.5,bw*1.3,0,7);ctx.fill(); }
  const limb=(x1,y1,x2,y2,w,c)=>{ ctx.lineCap='round';
    ctx.strokeStyle=OUT;ctx.lineWidth=w+lw*1.7;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke(); };
  const armY=by-bh*0.42;
  // legs (behind) — swing when walking
  limb(cx-bw*0.2, by-bh*0.1, cx-bw*0.2 + wk*7*s, by+9*s - Math.max(0,wk)*4*s, 8*s, col);
  limb(cx+bw*0.2, by-bh*0.1, cx+bw*0.2 - wk*7*s, by+9*s - Math.max(0,-wk)*4*s, 8*s, col);
  // back arm
  limb(cx-dir*bw*0.33, armY, cx-dir*bw*0.6, armY+bh*0.24, 7*s, dark);
  // ---- BODY (breathes via squash around feet) ----
  ctx.save();ctx.translate(cx,by);ctx.scale(1,sq);ctx.translate(-cx,-by);
  const bw2=bw*0.5;
  ctx.beginPath();
  ctx.moveTo(cx-bw2, by-bh*0.12);
  ctx.quadraticCurveTo(cx-bw2, by-bh*0.98, cx, by-bh*1.04);
  ctx.quadraticCurveTo(cx+bw2, by-bh*0.98, cx+bw2, by-bh*0.12);
  ctx.quadraticCurveTo(cx+bw2, by+3*s, cx, by+3*s);
  ctx.quadraticCurveTo(cx-bw2, by+3*s, cx-bw2, by-bh*0.12);
  ctx.closePath();
  ctx.fillStyle=col;ctx.fill();
  ctx.save();ctx.clip();
  const wg=ctx.createLinearGradient(cx-dir*bw2,0,cx+dir*bw2,0);wg.addColorStop(0,'transparent');wg.addColorStop(1,'rgba(255,205,130,'+(0.12+a.warmGlow*0.3)+')');
  ctx.fillStyle=wg;ctx.fillRect(cx-bw,by-bh*1.2,bw*2,bh*1.3);ctx.restore();
  ctx.lineWidth=lw;ctx.strokeStyle=OUT;ctx.stroke();
  ctx.restore();
  // ---- FACE (dot eyes track gaze) ----
  const eyeY=by-bh*0.62+bob+slump*bh*0.05, eyeDx=bw*0.17;
  for(const ex of [-eyeDx,eyeDx]){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+ex,eyeY,4.6*s,0,7);ctx.fill();
    ctx.lineWidth=1.3*s;ctx.strokeStyle=OUT;ctx.stroke();
    ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(cx+ex+look*2.2*s,eyeY+1*s,2.3*s,0,7);ctx.fill();
  }
  // mouth
  ctx.strokeStyle=OUT;ctx.lineWidth=2*s;ctx.lineCap='round';ctx.beginPath();
  const my=eyeY+bh*0.16;
  if(slump>0.26){ ctx.moveTo(cx-5*s,my+1.5*s);ctx.quadraticCurveTo(cx,my-1.5*s,cx+5*s,my+1.5*s); }
  else { ctx.moveTo(cx-5.5*s,my-1*s);ctx.quadraticCurveTo(cx,my+3*s+perk*2*s,cx+5.5*s,my-1*s); }
  ctx.stroke();
  // ---- FRONT ARM (reaches to feed the fire) ----
  const fx1=cx+dir*bw*0.33;
  if(a.reach>0.02){ const rr=a.reach; limb(fx1,armY, cx+dir*bw*(0.52+0.55*rr), armY-rr*20*s, 7*s, col); }
  else { limb(fx1,armY, cx+dir*bw*0.58, armY+bh*0.24, 7*s, col); }
  // ---- SQUIGGLE sprout ----
  ctx.strokeStyle=OUT;ctx.lineWidth=2*s;ctx.lineCap='round';
  const ty=by-bh*1.04*sq-1*s+bob;
  ctx.beginPath();
  if(a.sq===0){ ctx.moveTo(cx,ty);ctx.bezierCurveTo(cx+7*s,ty-10*s,cx-8*s,ty-12*s,cx+2*s,ty-18*s); }
  else if(a.sq===1){ ctx.moveTo(cx-3*s,ty);ctx.quadraticCurveTo(cx+11*s,ty-14*s,cx-2*s,ty-16*s); }
  else { ctx.moveTo(cx,ty);ctx.bezierCurveTo(cx-8*s,ty-8*s,cx+9*s,ty-14*s,cx-2*s,ty-20*s); }
  ctx.stroke();
  // ---- label ----
  if(a.you){ ctx.fillStyle='rgba(255,230,190,.85)';ctx.font='700 '+(10*Math.max(.9,s))+'px Inter';ctx.textAlign='center';ctx.fillText('you',cx,by+24*s); }
  else if(a.ai){ ctx.fillStyle='rgba(183,168,147,.75)';ctx.font='500 10px Inter';ctx.textAlign='center';ctx.fillText(a.name,cx,by+24*s);
    ctx.fillStyle='rgba(140,180,255,.85)';ctx.beginPath();ctx.arc(cx-ctx.measureText(a.name).width/2-6,by+24*s-3,2,0,7);ctx.fill(); }
}
function easeInOut(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}

window.addEventListener('resize',resize);
resize(); startScene(); requestAnimationFrame(frame);
setTimeout(()=>hideHint(),7000);
window.__fire={seats:()=>seats,you:()=>you,feed:()=>feedFire(you)};
</script>
