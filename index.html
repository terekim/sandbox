<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>sandbox — experiments</title>
<meta name="description" content="A personal playground of fast, polished front-end experiments." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0b;
    --fg: #f4f4f2;
    --muted: #8a8a85;
    --line: #1f1f22;
    --card-bg: #121214;
    --accent: #d6ff3f;
    --accent-ink: #0a0a0b;
    --radius: 18px;
    --gutter: 20px;
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --body: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Ambient accent glow */
  body::before {
    content: "";
    position: fixed;
    inset: -40% 0 auto -20%;
    height: 70vh;
    background: radial-gradient(60% 60% at 30% 0%, rgba(214,255,63,0.14), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 920px;
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) var(--gutter) 80px;
  }

  header { padding-top: 24px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(3.2rem, 18vw, 7rem);
    line-height: 0.92;
    letter-spacing: -0.03em;
    margin: 0 0 18px;
  }
  h1 .ink { color: var(--accent); }

  .lede {
    font-size: clamp(1rem, 4.4vw, 1.2rem);
    color: var(--muted);
    max-width: 34ch;
    margin: 0 0 8px;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    margin-top: 26px;
  }
  .tag {
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    background: rgba(255,255,255,0.02);
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 40px 0 28px;
  }

  .section-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--display);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .count { color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px;
    overflow: hidden;
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .card::after {
    content: "→";
    position: absolute;
    top: 20px; right: 20px;
    font-family: var(--display);
    color: var(--muted);
    transition: transform .2s ease, color .2s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    background: #16160f;
    transform: translateY(-2px);
    outline: none;
  }
  .card:hover::after, .card:focus-visible::after {
    color: var(--accent);
    transform: translate(4px, -2px);
  }
  .card-idx {
    font-family: var(--display);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.1em;
  }
  .card h3 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.35rem;
    letter-spacing: -0.01em;
    margin: 10px 0 6px;
    padding-right: 28px;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 48ch;
  }
  .card .slug {
    display: inline-block;
    margin-top: 14px;
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
  }

  .empty {
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 44px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty .big {
    font-family: var(--display);
    font-size: 1.1rem;
    color: var(--fg);
    margin-bottom: 8px;
  }

  footer {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    justify-content: space-between;
    color: var(--muted);
    font-size: 13px;
  }
  footer a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { border-color: var(--accent); }

  @media (min-width: 680px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow"><span class="dot"></span> terekim / sandbox</span>
      <h1>SAND<span class="ink">BOX</span></h1>
      <p class="lede">A playground for fast, polished front-end experiments. Open any one and poke at it.</p>
      <div class="meta">
        <span class="tag">no build step</span>
        <span class="tag">vanilla by default</span>
        <span class="tag">mobile-first</span>
      </div>
    </header>

    <div class="divider"></div>

    <div class="section-label">
      <span>Experiments</span>
      <span class="count" id="count">00</span>
    </div>

    <main class="grid" id="grid"></main>

    <footer>
      <span>Built on demand. Each folder is self-contained.</span>
      <a href="https://github.com/terekim/sandbox">View source</a>
    </footer>
  </div>

<script>
  // Add an experiment here when you build one. Newest first.
  const experiments = [
    { slug: "style", title: "Art Direction", desc: "The living style guide for the Campfire project: the character system (the quality bar) with live examples, palette, motion, and the in-progress environment." },
    { slug: "campfire", title: "Campfire", desc: "Sit at a fire with strangers, no words. Send warmth, feed the flames. Co-presence prototype with labelled AI tenders (local mock)." },
    { slug: "held", title: "Held", desc: "Leave one small anonymous line, hold a stranger's, and learn yours was held too. Ambient, no profiles, no replies. (MVP on a local mock.)" },
    { slug: "dirtbags", title: "Dirtbags", desc: "Turn-based artillery worms. Destructible terrain, wind, three weapons, and an AI opponent. Fully offline, installable." },
    { slug: "motherlode", title: "Motherlode", desc: "A mining incremental to sink hours into. Dig, automate, descend through strata, collapse to prestige. Fully offline, installable." },
    { slug: "typo-derby", title: "Typo Derby", desc: "The daily typing derby. Race the gang on one shared track a day, or practice offline. Installable as a PWA." },
  ];

  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  count.textContent = String(experiments.length).padStart(2, "0");

  if (experiments.length === 0) {
    grid.innerHTML = `
      <div class="empty" style="grid-column: 1 / -1;">
        <div class="big">Nothing here yet.</div>
        <div>The first experiment lands as soon as it's built.</div>
      </div>`;
  } else {
    grid.innerHTML = experiments.map((e, i) => `
      <a class="card" href="experiments/${e.slug}/index.html">
        <span class="card-idx">${String(i + 1).padStart(2, "0")}</span>
        <h3>${e.title}</h3>
        <p>${e.desc}</p>
        <span class="slug">${e.slug}</span>
      </a>`).join("");
  }
</script>
</body>
</html>
